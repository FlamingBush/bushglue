# Bush Glue broker configuration.
# Install to /etc/mosquitto/conf.d/bush.conf and restart mosquitto.

# Mosquitto 2.0 binds loopback-only unless a listener is declared, which
# leaves every networked node — the relay Pico, the CAN valve nodes, a phone
# running the fire-control UI — unable to reach the broker at all.
listener 1883 0.0.0.0
allow_anonymous true

# The rig is an isolated installation network; the devices are CircuitPython
# boards with a hand-rolled MQTT client and no credential support.

# Retained messages ARE the rig's persistent configuration: the run mode, the
# relay channel map, the poofer fallback. The default autosave_interval is
# 1800 s, so an unclean power loss discards up to half an hour of them —
# demonstrated by hard-killing the broker and watching a just-set mode revert.
# This box has lost power repeatedly, so bound that window to seconds. The
# writes are tiny and only happen when something actually changed, so the
# cost to the SD card is negligible.
autosave_interval 15

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mqtt-pixelblaze-bridge"
version = "0.2.0"
description = "A configurable MQTT-to-Pixelblaze bridge"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "paho-mqtt>=2.1,<3",
  "pixelblaze-client>=1.1.8,<2",
]

[project.scripts]
mqtt-pixelblaze-bridge = "mqtt_pixelblaze_bridge.cli:main"

[project.optional-dependencies]
test = [
  "mypy>=1.11",
  "pytest>=8",
]
build = ["build>=1.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
files = ["src"]
python_version = "3.10"
strict = true

[[tool.mypy.overrides]]
module = ["paho", "paho.*", "pixelblaze"]
ignore_missing_imports = true

[tool.setuptools.packages.find]
where = ["src"]
